ignore:
  resource_names:
      - AndAttachS3AccessPoint
      - DataRepositoryTask
      - FileCache
      - FileSystemFromBackup
      - Snapshot
      - VolumeFromBackup
  field_paths:
      # AdministrativeAction.TargetFileSystemValues is itself a FileSystem, so
      # the shape recurses infinitely. Progress reporting only.
      - FileSystem.AdministrativeActions
      # Same recursion through Backup.Volume: AdministrativeAction carries
      # TargetVolumeValues (a Volume) and TargetSnapshotValues (a Snapshot with
      # its own AdministrativeActions). Progress reporting only.
      - Volume.AdministrativeActions
      # Create input takes DNS-name strings; the output returns Alias structs
      # ({Name, Lifecycle}). Code-gen matches them by name and emits an
      # unassigned element var. `set.from` can't reach Alias.Name (a nested
      # member's SetFieldConfig isn't threaded into setResourceForSlice), so
      # drop it from the output shape; recoverObservedWindowsAliases reads the
      # names back instead.
      - WindowsFileSystemConfiguration.Aliases
      # Delete-time-only options (SkipFinalBackup, FinalBackupTags) that
      # code-gen wrongly tries to populate from the Create-shaped Spec structs.
      # Set by hand in sdk_delete_post_build_request instead.
      - DeleteFileSystemInput.LustreConfiguration
      - DeleteFileSystemInput.OpenZFSConfiguration
      - DeleteFileSystemInput.WindowsConfiguration
      # Same for DeleteVolume (SkipFinalBackup, BypassSnaplockEnterpriseRetention,
      # FinalBackupTags, OpenZFS Options): delete-time options read from
      # annotations by setDeleteVolumeConfiguration.
      - DeleteVolumeInput.OntapConfiguration
      - DeleteVolumeInput.OpenZFSConfiguration
      # Deprecated in favour of SizeInBytes. Describe reports both, so keeping
      # it would leave a nil-vs-value delta (or, late-initialized, a value
      # that conflicts with later SizeInBytes edits). Dropped from the input
      # shapes only: OntapVolumeConfiguration.SizeInMegabytes stays, since it
      # is part of Backup's released status.volume.
      - CreateOntapVolumeConfiguration.SizeInMegabytes
      - UpdateOntapVolumeConfiguration.SizeInMegabytes
      # Populated only for Amazon File Cache associations. This resource
      # manages FSx for Lustre associations only: CreateDataRepositoryAssociation
      # has no cache input, so these can never be set by this controller.
      - DataRepositoryAssociation.FileCacheId
      - DataRepositoryAssociation.FileCachePath
      - DataRepositoryAssociation.NFS
      - DataRepositoryAssociation.DataRepositorySubdirectories
resources:
  Backup:
    # ClientRequestToken is an SDK idempotency token the middleware auto-fills.
    ignore_idempotency_token: true
    # FSx has no UpdateBackup, so code-gen would emit sdk_update_not_implemented
    # (a terminal NotImplemented with no hook points) and every tag edit -- including
    # the controller-version tag on upgrade -- would make the CR terminal.
    # customUpdateBackup syncs tags and rejects any other delta.
    update_operation:
      custom_method_name: customUpdateBackup
    # Drop the Backup prefix that stutters on a Backup kind. DescribeBackups'
    # BackupIds input needs no rename: it already matches the <Resource>Ids
    # lookup, so the generated list request filters by Status.ID.
    renames:
      operations:
        CreateBackup:
          output_fields:
            BackupId: ID
            SourceBackupId: SourceID
            SourceBackupRegion: SourceRegion
        DescribeBackups:
          output_fields:
            BackupId: ID
            SourceBackupId: SourceID
            SourceBackupRegion: SourceRegion
        DeleteBackup:
          input_fields:
            BackupId: ID
    hooks:
      # Recovers the nested source IDs DescribeBackups reports so changes stay
      # in the delta, and makes FAILED (final) Terminal.
      sdk_read_many_post_set_output:
        template_path: hooks/backup/sdk_read_many_post_set_output.go.tpl
    # Tags round-trip via DescribeBackups; synced from customUpdateBackup.
    tags:
      ignore: false
    # CREATING, PENDING, TRANSFERRING and COPYING requeue until AVAILABLE.
    # FAILED is final; the read hook makes it Terminal with
    # Status.FailureDetails.
    synced:
      when:
        - path: Status.Lifecycle
          in: [ "AVAILABLE" ]
    # No terminal_codes: besides Tags, CreateBackup takes only the immutable
    # source IDs, so no Spec edit can clear an error. FileSystemNotFound and
    # VolumeNotFound can also be transient right after the source is created.
    exceptions:
      errors:
        404:
          code: BackupNotFound
    fields:
      # Only `ARN`/`BackupARN` are auto-detected; syncTags reads the ARN from
      # Status.ACKResourceMetadata.ARN.
      ResourceARN:
        is_arn: true
      # Without go_tag the Go-keyword escape would serialize this as `type_`.
      Type:
        go_tag: json:"type,omitempty"
      # Same keyword escape for SnapLock shapes (RetentionPeriod is one shared
      # shape). OpenZFSUserOrGroupQuota.Type stays `type_`: it is shared with
      # the released FileSystem CRD.
      Volume.OntapConfiguration.SnaplockConfiguration.AutocommitPeriod.Type:
        go_tag: json:"type,omitempty"
      Volume.OntapConfiguration.SnaplockConfiguration.RetentionPeriod.DefaultRetention.Type:
        go_tag: json:"type,omitempty"
      # Create-only. The CEL rule misses some changes (community#3097); the
      # read hook recovers the observed IDs so customUpdateBackup rejects them.
      FileSystemId:
        is_immutable: true
        references:
          resource: FileSystem
          path: Status.ID
      VolumeId:
        is_immutable: true
        references:
          resource: Volume
          path: Status.ID
    print:
      add_age_column: true
      add_synced_column: true
      order_by: index
      additional_columns:
        - name: ID
          json_path: .status.id
          type: string
          index: 10
        - name: FILESYSTEM
          json_path: .status.fileSystem.fileSystemID
          type: string
          index: 15
        - name: TYPE
          json_path: .status.type
          type: string
          index: 20
        - name: STATE
          json_path: .status.lifecycle
          type: string
          index: 30
        - name: PROGRESS
          json_path: .status.progressPercent
          type: integer
          index: 35
          priority: 1
  DataRepositoryAssociation:
    ignore_idempotency_token: true
    renames:
      operations:
        CreateDataRepositoryAssociation:
          output_fields:
            AssociationId: ID
        # FindIdentifiersInShape does not recognise `AssociationIds`, so
        # without the IDs rename newListRequestPayload never filters by
        # Status.ID and Describe returns every association in the region.
        DescribeDataRepositoryAssociations:
          input_fields:
            AssociationIds: IDs
          output_fields:
            AssociationId: ID
        UpdateDataRepositoryAssociation:
          input_fields:
            AssociationId: ID
          output_fields:
            AssociationId: ID
        DeleteDataRepositoryAssociation:
          input_fields:
            AssociationId: ID
    hooks:
      # Rejects removing an S3 policy (the update request cannot carry it),
      # requeues while CREATING/UPDATING/DELETING (updateable.when is emitted
      # after this hook, so it could not guard syncTags), and syncs tags:
      # UpdateDataRepositoryAssociation has no Tags member; tags go through
      # TagResource/UntagResource.
      sdk_update_pre_build_request:
        template_path: hooks/data_repository_association/sdk_update_pre_build_request.go.tpl
      # FSx appends "/" to DataRepositoryPath; keep the user's spelling.
      sdk_create_post_set_output:
        template_path: hooks/data_repository_association/sdk_create_post_set_output.go.tpl
      # The Update response is not authoritative for tags; keep desired's, and
      # desired's DataRepositoryPath spelling.
      sdk_update_post_set_output:
        template_path: hooks/data_repository_association/sdk_update_post_set_output.go.tpl
      # FAILED (documented as unrecoverable) is Terminal. MISCONFIGURED is left
      # retryable because the fix is usually bucket-side and Terminal would
      # stop the requeue that observes recovery. Also keeps the user's spelling
      # of DataRepositoryPath (FSx appends "/").
      sdk_read_many_post_set_output:
        template_path: hooks/data_repository_association/sdk_read_many_post_set_output.go.tpl
      # DeleteDataInFileSystem is a delete-time option, read from the
      # fsx.services.k8s.aws/delete-data-in-file-system annotation. The service
      # rejects a delete that omits it (despite the SDK marking it optional),
      # so an absent annotation sends the documented default, false.
      sdk_delete_post_build_request:
        template_path: hooks/data_repository_association/sdk_delete_post_build_request.go.tpl
      # Delete is async: record DELETING and hold the finalizer until Describe
      # reports DataRepositoryAssociationNotFound.
      sdk_delete_post_request:
        template_path: hooks/data_repository_association/sdk_delete_post_request.go.tpl
    # Tags round-trip via DescribeDataRepositoryAssociations.
    tags:
      ignore: false
    synced:
      when:
        - path: Status.Lifecycle
          in: [ "AVAILABLE" ]
    # Skip a redundant DeleteDataRepositoryAssociation while one is already in
    # flight. Every other state is allowed so a requested delete is never
    # blocked. The first successful delete records the lifecycle from the
    # response (DELETING) in Status via sdk_delete_post_request; later guarded
    # waits return a nil resource and do not patch Status, leaving that value
    # in place.
    deletable:
      when:
        - path: Status.Lifecycle
          in: [ "AVAILABLE", "MISCONFIGURED", "FAILED", "CREATING", "UPDATING" ]
    # No terminal_codes: BadRequest is the catch-all (also overlapping paths);
    # FileSystemNotFound/UnsupportedOperation are fixed only through the
    # immutable FileSystemId or the referenced FileSystem's state;
    # ServiceLimitExceeded is external; IncompatibleParameterError is an
    # idempotency-token clash the SDK clears next reconcile.
    exceptions:
      errors:
        404:
          code: DataRepositoryAssociationNotFound
    fields:
      # Only `ARN`/`DataRepositoryAssociationARN` are auto-detected; syncTags
      # reads the ARN from Status.ACKResourceMetadata.ARN.
      ResourceARN:
        is_arn: true
      # Absent from UpdateDataRepositoryAssociationInput -- create-only.
      # Known gap (community#3097): the CEL rule is skipped when the old value
      # is absent and cannot see FileSystemRef changes; Describe still reports
      # the actual values, so the delta remains visible.
      FileSystemId:
        is_immutable: true
        references:
          resource: FileSystem
          path: Status.ID
      DataRepositoryPath:
        is_immutable: true
      FileSystemPath:
        is_immutable: true
      BatchImportMetaDataOnCreate:
        is_immutable: true
        late_initialize:
          skip_incomplete_check: {}
      # Server default 1024 MiB.
      ImportedFileChunkSize:
        late_initialize:
          skip_incomplete_check: {}
    print:
      add_age_column: true
      add_synced_column: true
      order_by: index
      additional_columns:
        - name: ID
          json_path: .status.id
          type: string
          index: 10
        - name: PATH
          json_path: .spec.fileSystemPath
          type: string
          index: 20
        - name: STATE
          json_path: .status.lifecycle
          type: string
          index: 30
  FileSystem:
    # ClientRequestToken and friends are SDK implementation details the
    # middleware auto-fills; excluded by trait rather than by naming each
    # operation's input.
    ignore_idempotency_token: true
    # Update*Configuration members diverge from the Create*Configuration shapes
    # the Spec is built from (e.g. Add/RemoveRouteTableIds vs one RouteTableIds
    # list), so the generated newUpdateRequestPayload does not compile.
    update_operation:
      custom_method_name: customUpdateFileSystem
    # Drop the FileSystem prefix that stutters on a FileSystem kind.
    renames:
      operations:
        CreateFileSystem:
          input_fields:
            FileSystemType: Type
            FileSystemTypeVersion: TypeVersion
          output_fields:
            FileSystemId: ID
        DescribeFileSystems:
          output_fields:
            FileSystemType: Type
            FileSystemTypeVersion: TypeVersion
            FileSystemId: ID
        DeleteFileSystem:
          input_fields:
            FileSystemId: ID
    hooks:
      # sdkCreate/sdkFind assign ko.Spec.<Type>Configuration wholesale from the
      # output shape, which drops create-only members (and secret references)
      # that shape does not carry. These two hooks copy them back from the
      # resource the user actually submitted.
      sdk_create_post_build_request:
        template_path: hooks/file_system/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/file_system/sdk_create_post_set_output.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/file_system/sdk_read_many_post_set_output.go.tpl
      sdk_delete_post_build_request:
        template_path: hooks/file_system/sdk_delete_post_build_request.go.tpl
      # Delete is async: FSx stays DELETING for 5-10 min, so the finalizer is
      # held until DescribeFileSystems reports FileSystemNotFound.
      sdk_delete_pre_build_request:
        template_path: hooks/file_system/sdk_delete_pre_build_request.go.tpl
      sdk_delete_post_request:
        template_path: hooks/file_system/sdk_delete_post_request.go.tpl
    # Tags round-trip via DescribeFileSystems. Because sdkUpdate is custom, the
    # tag sync runs from customUpdateFileSystem, not a hook template.
    tags:
      ignore: false
    synced:
      when:
        - path: Status.Lifecycle
          in: [ "AVAILABLE" ]
    exceptions:
      errors:
        404:
          code: FileSystemNotFound
      # Only codes fixable by editing this Spec belong here -- a terminal
      # condition stops the requeue. Deliberately excluded:
      # IncompatibleParameterError (reused ClientRequestToken; the SDK sends a
      # fresh one next reconcile) and InvalidNetworkSettings (also raised while
      # the referenced security group is not yet permissive -- external state,
      # and SecurityGroupIDs/SubnetIDs are immutable).
      terminal_codes:
        - InvalidExportPath
        - InvalidImportPath
        - InvalidPerUnitStorageThroughput
        - MissingFileSystemConfiguration
        - UnsupportedOperation
    fields:
      # CRD.IsPrimaryARNField only auto-detects a member named `ARN` or
      # `FileSystemARN`, so without this Status.ACKResourceMetadata.ARN stays
      # nil -- and that ARN is the input to TagResource, so tag sync never runs.
      ResourceARN:
        is_arn: true
      # Without go_tag the Go-keyword escape would serialize this as `type_`.
      Type:
        is_immutable: true
        go_tag: json:"type"
      SubnetIds:
        is_immutable: true
        references:
          resource: Subnet
          service_name: ec2
          path: Status.SubnetID
      SecurityGroupIds:
        is_immutable: true
        references:
          resource: SecurityGroup
          service_name: ec2
          path: Status.ID
      KmsKeyId:
        is_immutable: true
        references:
          resource: Key
          service_name: kms
          path: Status.ACKResourceMetadata.ARN
      # Round-tripped by Describe but absent from every Update*Configuration
      # shape. Without is_immutable an edit is silently dropped -- the delta
      # never clears and Synced still reports True. CEL rejects it up front.
      LustreConfiguration.CopyTagsToBackups:
        is_immutable: true
      LustreConfiguration.DeploymentType:
        is_immutable: true
      LustreConfiguration.DriveCacheType:
        is_immutable: true
      LustreConfiguration.EfaEnabled:
        is_immutable: true
      OntapConfiguration.DeploymentType:
        is_immutable: true
      OntapConfiguration.EndpointIpAddressRange:
        is_immutable: true
      OntapConfiguration.PreferredSubnetId:
        is_immutable: true
        references:
          resource: Subnet
          service_name: ec2
          path: Status.SubnetID
      OntapConfiguration.RouteTableIds:
        references:
          resource: RouteTable
          service_name: ec2
          path: Status.RouteTableID
      OpenZFSConfiguration.DeploymentType:
        is_immutable: true
      OpenZFSConfiguration.EndpointIpAddressRange:
        is_immutable: true
      OpenZFSConfiguration.PreferredSubnetId:
        is_immutable: true
        references:
          resource: Subnet
          service_name: ec2
          path: Status.SubnetID
      OpenZFSConfiguration.RouteTableIds:
        references:
          resource: RouteTable
          service_name: ec2
          path: Status.RouteTableID
      WindowsConfiguration.ActiveDirectoryId:
        is_immutable: true
      WindowsConfiguration.CopyTagsToBackups:
        is_immutable: true
      WindowsConfiguration.DeploymentType:
        is_immutable: true
      WindowsConfiguration.PreferredSubnetId:
        is_immutable: true
        references:
          resource: Subnet
          service_name: ec2
          path: Status.SubnetID
      # Never returned by Describe, so `latest` is always nil and every
      # reconcile would re-issue UpdateFileSystem to re-set the password.
      # Same pairing as elasticache AuthToken / memorydb Password. Changing the
      # Secret reference does not rotate the password; that awaits the
      # runtime's general secret-change detection (runtime#253).
      OntapConfiguration.FsxAdminPassword:
        is_secret: true
        compare:
          is_ignored: true
      WindowsConfiguration.SelfManagedActiveDirectoryConfiguration.FileSystemAdministratorsGroup:
        go_tag: json:"administratorsGroup,omitempty"
      WindowsConfiguration.SelfManagedActiveDirectoryConfiguration.Password:
        is_secret: true
        compare:
          is_ignored: true
      # SelfManagedActiveDirectoryConfiguration is shared with
      # StorageVirtualMachine, which references the Secret; configure it here
      # too so the generated Ref is resolved on FileSystem as well.
      WindowsConfiguration.SelfManagedActiveDirectoryConfiguration.DomainJoinServiceAccountSecret:
        references:
          resource: Secret
          service_name: secretsmanager
          path: Status.ACKResourceMetadata.ARN
      # The remaining entries here are fields Describe cannot name-match back
      # into the Spec. Each is either immutable (create-only in the FSx API, so
      # an edit must be rejected rather than silently dropped) or recovered from
      # the response by a read hook so comparison still works. Nothing is left
      # both ignored and mutable.
      #
      # Aliases are mutable in FSx but only via
      # Associate/DisassociateFileSystemAliases, which this resource does not
      # implement yet -- immutable until it does.
      WindowsConfiguration.Aliases:
        is_immutable: true
      # Describe nests these under DataRepositoryConfiguration, which does not
      # name-match, so recoverObservedLustreDataRepository supplies the observed
      # values and comparison stays on. AutoImportPolicy is an
      # UpdateFileSystemLustreConfiguration member and stays mutable; the other
      # three are create-only.
      #
      # Known gap: is_immutable emits a field-level `self == oldSelf` rule,
      # which Kubernetes skips when the old value is absent, so adding an
      # immutable field after creation passes admission. Where Describe reports
      # the field the delta still catches it. RootVolumeConfiguration and
      # SecurityGroupIds are not reported, so adding one -- or retargeting
      # SecurityGroupRefs, which CEL cannot see -- is silently ignored.
      # No generic fix exists yet: freezing presence in CEL also rejects the
      # controller's own late_initialize writes. See
      # aws-controllers-k8s/community#3097.
      LustreConfiguration.ExportPath:
        is_immutable: true
      LustreConfiguration.ImportPath:
        is_immutable: true
      LustreConfiguration.ImportedFileChunkSize:
        is_immutable: true
      # Create-only: absent from UpdateFileSystemOpenZFSConfiguration, and the
      # output shape carries RootVolumeId instead.
      OpenZFSConfiguration.RootVolumeConfiguration:
        is_immutable: true
        compare:
          is_ignored: true
    print:
      add_age_column: true
      add_synced_column: true
      order_by: index
      additional_columns:
        - name: ID
          json_path: .status.id
          type: string
          index: 10
        - name: TYPE
          json_path: .spec.type
          type: string
          index: 15
        - name: STORAGE
          json_path: .spec.storageCapacity
          type: integer
          index: 20
        - name: DNSNAME
          json_path: .status.dnsName
          type: string
          index: 25
          priority: 1
        - name: STATE
          json_path: .status.lifecycle
          type: string
          index: 30
  StorageVirtualMachine:
    # ClientRequestToken is an SDK idempotency token the middleware auto-fills.
    ignore_idempotency_token: true
    # Drop the StorageVirtualMachine prefix that stutters on the kind.
    # DescribeStorageVirtualMachines' StorageVirtualMachineIds input needs no
    # rename when it matches the <Resource>Ids lookup (Backup precedent).
    renames:
      operations:
        CreateStorageVirtualMachine:
          output_fields:
            StorageVirtualMachineId: ID
        DescribeStorageVirtualMachines:
          output_fields:
            StorageVirtualMachineId: ID
        UpdateStorageVirtualMachine:
          input_fields:
            StorageVirtualMachineId: ID
          output_fields:
            StorageVirtualMachineId: ID
        DeleteStorageVirtualMachine:
          input_fields:
            StorageVirtualMachineId: ID
    hooks:
      # Syncs tags (UpdateStorageVirtualMachine has no Tags member), skips the
      # update call on tags-only changes, and rejects removing the AD block,
      # which UpdateSvmActiveDirectoryConfiguration cannot express.
      sdk_update_pre_build_request:
        template_path: hooks/storage_virtual_machine/sdk_update_pre_build_request.go.tpl
      # Restores the write-only AD Password secret reference (Describe never
      # returns it) and the create-only RootVolumeSecurityStyle when Describe
      # omits it, reads tags via ListTagsForResource, and makes FAILED
      # Terminal.
      sdk_read_many_post_set_output:
        template_path: hooks/storage_virtual_machine/sdk_read_many_post_set_output.go.tpl
      # Delete is async: record DELETING and hold the finalizer until Describe
      # reports StorageVirtualMachineNotFound.
      sdk_delete_post_request:
        template_path: hooks/storage_virtual_machine/sdk_delete_post_request.go.tpl
    # DescribeStorageVirtualMachines does not report SVM tags (seen in e2e);
    # the read hook fetches them with ListTagsForResource (rm.getTags).
    tags:
      ignore: false
    # CREATING and PENDING requeue until CREATED. MISCONFIGURED is documented
    # as recoverable and stays retryable; FAILED is made Terminal by the read
    # hook.
    synced:
      when:
        - path: Status.Lifecycle
          in: [ "CREATED" ]
    # Skip a redundant DeleteStorageVirtualMachine while one is in flight.
    # Every other state is allowed so a requested delete is never blocked.
    # This is an allow-list of every StorageVirtualMachineLifecycle value in
    # the SDK model except DELETING; a lifecycle value FSx adds later would
    # requeue the delete until the list is updated and the controller is
    # regenerated.
    deletable:
      when:
        - path: Status.Lifecycle
          in: [ "CREATED", "CREATING", "PENDING", "FAILED", "MISCONFIGURED" ]
    # No terminal_codes: BadRequest is the catch-all (it also covers deleting
    # an SVM that still has non-root volumes); ActiveDirectoryError can come
    # from AD/DNS/network state outside the Spec; UnsupportedOperation and
    # FileSystemNotFound are fixed only through the immutable FileSystemId (and
    # the latter is transient right after the parent is created);
    # ServiceLimitExceeded is external; IncompatibleParameterError is an
    # idempotency-token clash the SDK clears next reconcile.
    exceptions:
      errors:
        404:
          code: StorageVirtualMachineNotFound
    fields:
      # Only `ARN`/`StorageVirtualMachineARN` are auto-detected; syncTags reads
      # the ARN from Status.ACKResourceMetadata.ARN.
      ResourceARN:
        is_arn: true
      # Absent from UpdateStorageVirtualMachineInput -- create-only.
      # Known gap (community#3097): the CEL rule is skipped when the old value
      # is absent and cannot see FileSystemRef changes; Describe still reports
      # the actual values, so the delta remains visible.
      FileSystemId:
        is_immutable: true
        references:
          resource: FileSystem
          path: Status.ID
      Name:
        is_immutable: true
      # Create-only (not in UpdateStorageVirtualMachineInput). When the Spec
      # omits it and Describe reports one (the FSx default), late_initialize
      # copies the observed value into the Spec so no delta (and no no-op
      # UpdateStorageVirtualMachine) recurs. e2e showed Describe can omit it
      # for an SVM created without one, so skip_incomplete_check keeps that
      # case from requeueing forever. The Create/Update responses are ignored
      # and the read hook restores the declared value when Describe leaves it
      # empty (restoreRootVolumeSecurityStyle); an observed value is kept as-is.
      RootVolumeSecurityStyle:
        is_immutable: true
        late_initialize:
          skip_incomplete_check: {}
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
      # Write-only: never returned by Describe, so latest keeps desired's
      # reference and it never produces a delta. Changing the Secret does not
      # rotate the password; that awaits the runtime's general secret-change
      # detection (runtime#253).
      SvmAdminPassword:
        is_secret: true
      # Keep the desired block (with its Password secret reference) after
      # Create and Update; the next Describe reports the observed values.
      ActiveDirectoryConfiguration:
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
      # Required here as well as on the FileSystem path: is_secret is resolved
      # per CRD path even though the typedef is shared. Deliberately NOT
      # compare-ignored (unlike the FileSystem path): the read hook restores
      # the reference from desired, so it never produces a delta, and a field
      # must not be both mutable and compare-ignored (Pattern 2b).
      ActiveDirectoryConfiguration.SelfManagedActiveDirectoryConfiguration.Password:
        is_secret: true
      # FSx fills these in when they are left out (the domain's "Domain Admins"
      # group and the directory's default OU) and Describe reports them in
      # SelfManagedActiveDirectoryAttributes. late_initialize copies the observed
      # value into the Spec, so an omitted value does not leave a nil-vs-value
      # delta that resends UpdateStorageVirtualMachine (with both passwords)
      # every reconcile. These paths are per-CRD; FileSystem is unaffected.
      # skip_incomplete_check: not yet confirmed against a live AD-joined SVM
      # that Describe always reports them, so a missing value must not requeue
      # forever.
      # Known gap (not reproduced): if FSx changes the case of DomainName or
      # NetBiosName, or reorders DNSIPs, the delta would still fire every
      # reconcile. No compare option can absorb that without hiding real drift.
      ActiveDirectoryConfiguration.SelfManagedActiveDirectoryConfiguration.FileSystemAdministratorsGroup:
        late_initialize:
          skip_incomplete_check: {}
      ActiveDirectoryConfiguration.SelfManagedActiveDirectoryConfiguration.OrganizationalUnitDistinguishedName:
        late_initialize:
          skip_incomplete_check: {}
      # Lives on the typedef shared with FileSystem, so FileSystem gains the
      # same reference (also configured on the FileSystem path).
      ActiveDirectoryConfiguration.SelfManagedActiveDirectoryConfiguration.DomainJoinServiceAccountSecret:
        references:
          resource: Secret
          service_name: secretsmanager
          path: Status.ACKResourceMetadata.ARN
      # The Update response is not authoritative for tags (synced through
      # TagResource/UntagResource); keep desired's.
      Tags:
        set:
          - method: Update
            ignore: true
    print:
      add_age_column: true
      add_synced_column: true
      order_by: index
      additional_columns:
        - name: ID
          json_path: .status.id
          type: string
          index: 10
        - name: FILESYSTEM
          json_path: .spec.fileSystemID
          type: string
          index: 15
        - name: NAME
          json_path: .spec.name
          type: string
          index: 20
        - name: STATE
          json_path: .status.lifecycle
          type: string
          index: 30
  Volume:
    # ClientRequestToken is an SDK idempotency token the middleware auto-fills.
    ignore_idempotency_token: true
    # UpdateVolume's Name is documented for OpenZFS volumes only; sending it
    # unchanged on every ONTAP update would risk an unrelated rejection. Only
    # top-level members are omitted: a changed OntapConfiguration still
    # carries all of its members.
    update_operation:
      omit_unchanged_fields: true
    # Drop the Volume prefix that stutters on a Volume kind. DescribeVolumes'
    # VolumeIds input needs no rename: it matches the <Resource>Ids lookup, so
    # the generated list request filters by Status.ID (Backup precedent).
    renames:
      operations:
        CreateVolume:
          input_fields:
            VolumeType: Type
          output_fields:
            VolumeId: ID
            VolumeType: Type
        DescribeVolumes:
          output_fields:
            VolumeId: ID
            VolumeType: Type
        UpdateVolume:
          input_fields:
            VolumeId: ID
          output_fields:
            VolumeId: ID
            VolumeType: Type
        DeleteVolume:
          input_fields:
            VolumeId: ID
    hooks:
      # Syncs tags (UpdateVolume has no Tags member) and skips the update call
      # on tags-only changes.
      sdk_update_pre_build_request:
        template_path: hooks/volume/sdk_update_pre_build_request.go.tpl
      # The generated setters replace Spec.OntapConfiguration wholesale from
      # the output shape, which has no ConstituentsPerAggregate; keep the
      # declared value. Also keeps CoolingPeriod unset when the user left it
      # unset (a default FSx applies only to some tiering policies).
      sdk_create_post_set_output:
        template_path: hooks/volume/sdk_create_post_set_output.go.tpl
      # FSx reorders the OpenZFS client configurations and quota entries and
      # always reports the root (Id 0, quota 0) quotas; treat those as equal.
      delta_pre_compare:
        template_path: hooks/volume/delta_pre_compare.go.tpl
      # Same restore after Describe, reads tags via ListTagsForResource, and
      # makes FAILED Terminal.
      sdk_read_many_post_set_output:
        template_path: hooks/volume/sdk_read_many_post_set_output.go.tpl
      # Delete-time options come from annotations (skip-final-backup,
      # bypass-snaplock-enterprise-retention, openzfs-delete-options); absent
      # annotations send nothing so FSx's defaults apply. FinalBackupTags is
      # not supported yet: a tag list does not fit one annotation well.
      sdk_delete_post_build_request:
        template_path: hooks/volume/sdk_delete_post_build_request.go.tpl
      # Delete is async: record DELETING and hold the finalizer until Describe
      # reports VolumeNotFound.
      sdk_delete_post_request:
        template_path: hooks/volume/sdk_delete_post_request.go.tpl
    # Tags are inline on CreateVolume; updates go through
    # TagResource/UntagResource. DescribeVolumes does not report tags despite
    # the model (e2e), so the read hook fetches them with ListTagsForResource
    # (rm.getTags), as for StorageVirtualMachine.
    tags:
      ignore: false
    # ONTAP volumes settle in CREATED, OpenZFS volumes in AVAILABLE; CREATING
    # and PENDING requeue. MISCONFIGURED is documented as recoverable and stays
    # retryable; FAILED is made Terminal by the read hook.
    synced:
      when:
        - path: Status.Lifecycle
          in: [ "CREATED", "AVAILABLE" ]
    # Skip a redundant DeleteVolume while one is in flight. Every other state
    # is allowed so a requested delete is never blocked. This is an allow-list
    # of every VolumeLifecycle value in the SDK model except DELETING; a
    # lifecycle value FSx adds later would requeue the delete until the list
    # is updated and the controller is regenerated.
    deletable:
      when:
        - path: Status.Lifecycle
          in: [ "AVAILABLE", "CREATED", "CREATING", "PENDING", "FAILED", "MISCONFIGURED" ]
    # UpdateVolume is rejected while the volume is CREATING (e2e: "BadRequest:
    # Volume ... cannot be updated because it is being created", retried
    # 250+ times in a tight backoff right after create, when Describe does
    # not yet report UserAndGroupQuotas). Only CREATING is held back, the one
    # state with evidence; like `deletable`, this lists every other
    # VolumeLifecycle value in the SDK model.
    updateable:
      when:
        - path: Status.Lifecycle
          in: [ "AVAILABLE", "CREATED", "PENDING", "FAILED", "MISCONFIGURED", "DELETING" ]
    # Only codes fixable by editing this Spec belong here. MissingVolumeConfiguration
    # is cleared by adding the ontapConfiguration/openZFSConfiguration block
    # that matches spec.type. Deliberately excluded: BadRequest (the
    # catch-all, also used for duplicate names); UnsupportedOperation (fixed
    # only through the immutable SVM/parent or the parent file system's type);
    # StorageVirtualMachineNotFound and FileSystemNotFound (transient right
    # after the parent is created, and the IDs are immutable);
    # ServiceLimitExceeded (external); IncompatibleParameterError (an
    # idempotency-token clash the SDK clears next reconcile).
    exceptions:
      errors:
        404:
          code: VolumeNotFound
      terminal_codes:
        - MissingVolumeConfiguration
    fields:
      # Only `ARN`/`VolumeARN` are auto-detected; syncTags reads the ARN from
      # Status.ACKResourceMetadata.ARN.
      ResourceARN:
        is_arn: true
      # Absent from UpdateVolumeInput. Without go_tag the Go-keyword escape
      # would serialize this as `type_`.
      Type:
        is_immutable: true
        go_tag: json:"type,omitempty"
      # The Update response is not authoritative for tags (synced through
      # TagResource/UntagResource); keep desired's. `ignore: true` rather than
      # "all": UpdateVolumeInput has no Tags member to skip.
      Tags:
        set:
          - method: Update
            ignore: true
      # UpdateVolume is asynchronous and its response reports the volume as
      # it was before the update (e2e: after an ONTAP SizeInBytes and
      # SnapshotPolicy change, and an OpenZFS quota/compression/NFS/quota-list
      # change, the response still had the old values). Setting the Spec from
      # it patched the old values back onto the CR, reverting the user's edit.
      # Keep desired's; the next Describe reports the applied state, so drift
      # stays visible. `ignore: true` rather than "all": the request must still
      # be built from these members.
      Name:
        set:
          - method: Update
            ignore: true
      OntapConfiguration:
        set:
          - method: Update
            ignore: true
      OpenZFSConfiguration:
        set:
          - method: Update
            ignore: true
      # Create-only members: absent from UpdateOntapVolumeConfiguration /
      # UpdateOpenZFSVolumeConfiguration (and UpdateSnaplockConfiguration).
      # Without is_immutable an edit would be silently dropped.
      # Known gap (community#3097): the CEL rule is skipped when the old value
      # is absent and cannot see ...Ref changes; Describe still reports the
      # actual values (except ConstituentsPerAggregate, which is restored from
      # desired), so the delta remains visible.
      OntapConfiguration.StorageVirtualMachineId:
        is_immutable: true
        references:
          resource: StorageVirtualMachine
          path: Status.ID
      # Immutable per member, not on the AggregateConfiguration struct:
      # Aggregates is late-initialized, and a struct-level `self == oldSelf`
      # rule would reject that write when the user declared only
      # ConstituentsPerAggregate. A member-level rule is skipped when the old
      # value is absent.
      OntapConfiguration.AggregateConfiguration.ConstituentsPerAggregate:
        is_immutable: true
      # Stutters with both the parent and the kind. Defaults to RW;
      # late-initialized like the server-defaulted members below.
      OntapConfiguration.OntapVolumeType:
        is_immutable: true
        go_tag: json:"type,omitempty"
        late_initialize:
          skip_incomplete_check: {}
      # Stutters with the kind. Defaults to FLEXVOL; late-initialized.
      OntapConfiguration.VolumeStyle:
        is_immutable: true
        go_tag: json:"style,omitempty"
        late_initialize:
          skip_incomplete_check: {}
      OntapConfiguration.SnaplockConfiguration.SnaplockType:
        is_immutable: true
      # Keyword escape for the shared SnapLock shapes (same as Backup).
      # OpenZFSUserOrGroupQuota.Type stays `type_`: it is shared with the
      # released FileSystem CRD.
      OntapConfiguration.SnaplockConfiguration.AutocommitPeriod.Type:
        go_tag: json:"type,omitempty"
      OntapConfiguration.SnaplockConfiguration.RetentionPeriod.DefaultRetention.Type:
        go_tag: json:"type,omitempty"
      # Resolves only when the parent is a Volume CR. The file system's root
      # volume is not a CR, so a child of the root sets the ID directly.
      OpenZFSConfiguration.ParentVolumeId:
        is_immutable: true
        references:
          resource: Volume
          path: Status.ID
      # Defaults to false; late-initialized.
      OpenZFSConfiguration.CopyTagsToSnapshots:
        is_immutable: true
        late_initialize:
          skip_incomplete_check: {}
      OpenZFSConfiguration.OriginSnapshot:
        is_immutable: true
      # Server-defaulted members: FSx fills these in when they are left out.
      # The generated Create setter already copies the whole configuration
      # block from the response into the Spec; late_initialize
      # covers a default that only a later Describe reports, so it does not
      # leave a nil-vs-value delta (and an UpdateVolume). Nested members are
      # only filled when their parent struct (TieringPolicy,
      # AggregateConfiguration) is in the Spec. The list comes from the
      # documented defaults and has not yet been checked against Describe for
      # a minimal live volume; test_volume.py asserts each one and that no
      # idle UpdateVolume is sent. skip_incomplete_check keeps a member
      # Describe does not report from requeueing forever.
      # Deliberately not late-initialized: TieringPolicy.CoolingPeriod (its
      # default applies only to AUTO/SNAPSHOT_ONLY, so the read hook drops it
      # when undeclared), StorageVirtualMachineId and ParentVolumeId (with a
      # ...Ref set, a late-initialized ID would make reference resolution fail),
      # and SizeInBytes/JunctionPath (no documented default).
      OntapConfiguration.SecurityStyle:
        late_initialize:
          skip_incomplete_check: {}
      OntapConfiguration.SnapshotPolicy:
        late_initialize:
          skip_incomplete_check: {}
      OntapConfiguration.TieringPolicy.Name:
        late_initialize:
          skip_incomplete_check: {}
      OntapConfiguration.CopyTagsToBackups:
        late_initialize:
          skip_incomplete_check: {}
      OntapConfiguration.AggregateConfiguration.Aggregates:
        is_immutable: true
        late_initialize:
          skip_incomplete_check: {}
      OpenZFSConfiguration.DataCompressionType:
        late_initialize:
          skip_incomplete_check: {}
      OpenZFSConfiguration.RecordSizeKiB:
        late_initialize:
          skip_incomplete_check: {}
      OpenZFSConfiguration.ReadOnly:
        late_initialize:
          skip_incomplete_check: {}
      # -1 (no quota/reservation) is accepted back by UpdateVolume.
      OpenZFSConfiguration.StorageCapacityQuotaGiB:
        late_initialize:
          skip_incomplete_check: {}
      OpenZFSConfiguration.StorageCapacityReservationGiB:
        late_initialize:
          skip_incomplete_check: {}
    print:
      add_age_column: true
      add_synced_column: true
      order_by: index
      additional_columns:
        - name: ID
          json_path: .status.id
          type: string
          index: 10
        - name: TYPE
          json_path: .spec.type
          type: string
          index: 15
        - name: NAME
          json_path: .spec.name
          type: string
          index: 20
        - name: FILESYSTEM
          json_path: .status.fileSystemID
          type: string
          index: 25
          priority: 1
        - name: STATE
          json_path: .status.lifecycle
          type: string
          index: 30
